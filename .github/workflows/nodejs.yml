name: github pages

on:
  push:
    branches:
      - master

permissions:
  contents: read

# デプロイが重なったら、走ってる方は止めずに順番に待つ。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # yarn install で外部のパッケージを動かすので、build には書き込み権限を渡さない。
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
    - uses: actions/checkout@v7

    - name: Setup Node
      uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc
        cache: yarn

    - name: Install dependencies
      run: yarn install --frozen-lockfile

    - name: Build
      run: yarn build

    - name: Setup Pages
      uses: actions/configure-pages@v6

    - name: Upload artifact
      uses: actions/upload-pages-artifact@v5
      with:
        path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v5
